<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Скачать BanlanX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    .loader {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #ccc;
      border-top: 3px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Перенаправляем...</p>
  </div>

  <script>
    const userAgent = navigator.userAgent;
    let targetUrl;

    if (/iPhone|iPad|iPod/.test(userAgent)) {
      // iOS: App Store
      targetUrl = "https://apps.apple.com/app/banlanx/id1508309620?l";
    } else if (/Android/.test(userAgent)) {
      // Android: Google Play
      targetUrl = "https://play.google.com/store/apps/details?id=com.spled.scenex";
    }

    // Перенаправление
    window.location.href = targetUrl;
  </script>
</body>
</html>
